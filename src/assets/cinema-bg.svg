<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShadowClips - Cinematic Vector Background</title>
    <style>
        body { 
            margin: 0; 
            background-color: #09090b; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            overflow: hidden; 
        }
        svg { 
            width: 100%; 
            height: 100vh; 
            object-fit: cover; 
        }
    </style>
</head>
<body>
    <!-- KODE SVG VEKTOR DIMULAI DARI SINI -->
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
        <defs>
            <!-- Gradien Cahaya Layar (Teal & Emerald) -->
            <radialGradient id="screenGlow" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#10B981" stop-opacity="0.25"/>
                <stop offset="50%" stop-color="#0D9488" stop-opacity="0.1"/>
                <stop offset="100%" stop-color="#09090b" stop-opacity="0"/>
            </radialGradient>
            
            <!-- Gradien Sorotan Lampu Proyektor -->
            <linearGradient id="projectorBeam" x1="50%" y1="0%" x2="50%" y2="100%">
                <stop offset="0%" stop-color="#0D9488" stop-opacity="0.15"/>
                <stop offset="100%" stop-color="#10B981" stop-opacity="0.0"/>
            </linearGradient>

            <!-- Gradien Kursi Penonton untuk Efek Kedalaman -->
            <linearGradient id="seatGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#18181b" stop-opacity="1"/>
                <stop offset="100%" stop-color="#09090b" stop-opacity="1"/>
            </linearGradient>

            <!-- Cetakan Siluet 1 Kursi Bioskop -->
            <g id="seat">
                <!-- Sandaran Kepala -->
                <path d="M 25 0 Q 50 -10 75 0 L 85 40 L 15 40 Z" fill="url(#seatGradient)"/>
                <!-- Sandaran Punggung -->
                <rect x="15" y="40" width="70" height="110" fill="#121316"/>
                <!-- Sandaran Tangan -->
                <rect x="5" y="70" width="15" height="80" rx="5" fill="#09090b" stroke="#1f2023" stroke-width="2"/>
                <rect x="80" y="70" width="15" height="80" rx="5" fill="#09090b" stroke="#1f2023" stroke-width="2"/>
            </g>
            
            <!-- Cetakan 1 Baris Penuh Kursi Penonton -->
            <g id="seatRow">
                <use href="#seat" x="0" y="0"/>
                <use href="#seat" x="100" y="0"/>
                <use href="#seat" x="200" y="0"/>
                <use href="#seat" x="300" y="0"/>
                <use href="#seat" x="400" y="0"/>
                <use href="#seat" x="500" y="0"/>
                <use href="#seat" x="600" y="0"/>
                <use href="#seat" x="700" y="0"/>
                <use href="#seat" x="800" y="0"/>
                <use href="#seat" x="900" y="0"/>
                <use href="#seat" x="1000" y="0"/>
                <use href="#seat" x="1100" y="0"/>
                <use href="#seat" x="1200" y="0"/>
                <use href="#seat" x="1300" y="0"/>
                <use href="#seat" x="1400" y="0"/>
                <use href="#seat" x="1500" y="0"/>
                <use href="#seat" x="1600" y="0"/>
                <use href="#seat" x="1700" y="0"/>
                <use href="#seat" x="1800" y="0"/>
                <use href="#seat" x="1900" y="0"/>
                <use href="#seat" x="2000" y="0"/>
                <use href="#seat" x="2100" y="0"/>
            </g>
        </defs>

        <!-- Warna Latar Belakang Dasar (Zinc 950) -->
        <rect width="1920" height="1080" fill="#09090b"/>

        <!-- Area Layar Bioskop Raksasa -->
        <rect x="210" y="80" width="1500" height="550" fill="url(#screenGlow)" rx="10"/>
        <rect x="210" y="80" width="1500" height="550" fill="none" stroke="#18181b" stroke-width="12" rx="10"/>
        
        <!-- Ikon Abstrak Play di Tengah Layar -->
        <polygon points="910,270 1060,355 910,440" fill="#10B981" opacity="0.15"/>

        <!-- Cahaya Proyektor yang Menyebar -->
        <polygon points="960,-50 -300,650 2220,650" fill="url(#projectorBeam)"/>
        
        <!-- Partikel Debu Geometris di Dalam Cahaya -->
        <circle cx="800" cy="300" r="3" fill="#0D9488" opacity="0.4"/>
        <circle cx="1100" cy="450" r="2" fill="#10B981" opacity="0.5"/>
        <circle cx="950" cy="200" r="4" fill="#0D9488" opacity="0.3"/>
        <circle cx="600" cy="500" r="2" fill="#10B981" opacity="0.2"/>
        <circle cx="1300" cy="350" r="3" fill="#0D9488" opacity="0.4"/>
        <circle cx="1400" cy="550" r="5" fill="#10B981" opacity="0.2"/>
        <circle cx="500" cy="400" r="3" fill="#0D9488" opacity="0.5"/>

        <!-- BARISAN KURSI PENONTON (Diberi Skala agar terlihat 3D/Mendalam) -->
        <!-- Baris Belakang (Paling Kecil) -->
        <g transform="translate(-100, 750) scale(0.85)">
            <use href="#seatRow"/>
        </g>
        
        <!-- Baris Tengah -->
        <g transform="translate(-150, 850) scale(1)">
            <use href="#seatRow"/>
        </g>

        <!-- Baris Depan (Paling Besar & Gelap) -->
        <g transform="translate(-200, 950) scale(1.3)">
            <use href="#seatRow"/>
            <!-- Lapisan bayangan ekstra untuk baris terdepan -->
            <rect x="0" y="0" width="2200" height="300" fill="#09090b" opacity="0.5"/>
        </g>
        
        <!-- Efek Vignette (Gelap di Sudut-sudut Layar) -->
        <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
            <stop offset="50%" stop-color="#09090b" stop-opacity="0"/>
            <stop offset="100%" stop-color="#09090b" stop-opacity="1"/>
        </radialGradient>
        <rect width="1920" height="1080" fill="url(#vignette)"/>
    </svg>
</body>
</html>